name: Keep All Streamlit Apps Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping All Streamlit Apps
        run: |
          echo "Pinging all Streamlit apps..."
          apps=(
            "https://hot-store.streamlit.app"
            "https://climate-weather.streamlit.app"
            "https://samaya.streamlit.app"
            "https://visual-csv.streamlit.app"
            "https://viz-simple-compound-interest.streamlit.app"
            "https://viz-linear-eqn.streamlit.app"
            "https://viz-triangle.streamlit.app"
            "https://graphquadratic.streamlit.app"
            "https://viz-logarithm.streamlit.app"
            "https://circle-sector.streamlit.app"
            "https://our-birthdays.streamlit.app"
            "https://summarize-info.streamlit.app"
            "https://hot-decision-tree.streamlit.app"
            "https://translate-language.streamlit.app"
            "https://ner-from-text.streamlit.app"
            "https://game-practice-reminder.streamlit.app"
            "https://viz-svm-classifier.streamlit.app"
            "https://hot-kmeans-clustering.streamlit.app"
            "https://self-org-map.streamlit.app"
            "https://detect-mood-selfie.streamlit.app"
            "https://pdf-to-txt.streamlit.app"
            "https://hot-linear-regression.streamlit.app"
            "https://openai-hot-bot.streamlit.app"
          )

          for url in "${apps[@]}"; do
            echo "Pinging $url"
            curl -L -s -o /dev/null -w "%{http_code}\n" -H "User-Agent: Mozilla/5.0" "$url" || true
          done
